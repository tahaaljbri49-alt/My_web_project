    <!-- محتوى صفحة تواصل معنا -->
    <main class="container my-5">
        <h2 class="mb-4 text-center fw-bold"><i class="fa-solid fa-envelope-open-text text-primary"></i> تواصل معنا</h2>
        
        <div class="row g-5">
            <!-- نموذج الإرسال -->
            <div class="col-md-7">
                <div class="card shadow-sm p-4 border-0">
                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label"><i class="fa-solid fa-user"></i> الاسم الكامل</label>
                            <input type="text" class="form-control" id="name" placeholder="أدخل اسمك هنا" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label"><i class="fa-solid fa-at"></i> البريد الإلكتروني</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label"><i class="fa-solid fa-comment"></i> رسالتك</label>
                            <textarea class="form-control" id="message" rows="4" placeholder="اكتب رسالتك هنا..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-paper-plane"></i> إرسال الرسالة</button>
                    </form>
                </div>
            </div>

            <!-- معلومات التواصل وأيقونات Font Awesome -->
            <div class="col-md-5">
                <div class="card shadow-sm p-4 border-0 bg-light h-100">
                    <h4 class="fw-bold mb-3">معلومات الاتصال</h4>
                    <p class="text-muted">يسعدنا تواصلكم معنا عبر القنوات التالية:</p>
                    
                    <ul class="list-unstyled mt-3">
                        <li class="mb-3 d-flex align-items-center">
                            <i class="fa-solid fa-location-dot text-danger fa-lg me-3"></i>
                            <span>اليمن - جامعة ذمار</span>
                        </li>
                        <li class="mb-3 d-flex align-items-center">
                            <i class="fa-solid fa-phone text-success fa-lg me-3"></i>
                            <span>+967 783404821</span>
                        </li>
                        <li class="mb-3 d-flex align-items-center">
                            <i class="fa-solid fa-envelope text-primary fa-lg me-3"></i>
                            <span>Tahaaljbri49@gmail.com</span>
                        </li>
                    </ul>

                    <hr class="my-4">

                    <!-- وسائل التواصل الاجتماعي باستخدام Font Awesome -->
                    <h5 class="fw-bold mb-3">تابعنا على المنصات</h5>
