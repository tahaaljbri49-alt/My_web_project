<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - مشروع تصميم الويب</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- شريط التنقل -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html"><i class="fa-solid fa-code"></i> موقعي الهندسي</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">من نحن</a></li>
                        <li class="nav-item"><a class="nav-link" href="services.html">الخدمات</a></li>
                        <li class="nav-item"><a class="nav-link" href="gallery.html">المعرض</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">تواصل معنا</a></li>
                        <li class="nav-item"><a class="nav-link active btn btn-primary text-white ms-2 px-3" href="login.html">دخول</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- نموذج تسجيل الدخول مع التحقق Validation -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0 p-4 bg-white rounded-3">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-right-to-bracket fa-3x text-primary mb-2"></i>
                        <h3 class="fw-bold">تسجيل الدخول</h3>
                        <p class="text-muted">أدخل بيانات حسابك للمتابعة</p>
                    </div>

                    <form class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label"><i class="fa-solid fa-envelope"></i> البريد الإلكتروني</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            <div class="invalid-feedback">يرجى إدخال بريد إلكتروني صحيح.</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label"><i class="fa-solid fa-lock"></i> كلمة المرور</label>
                            <input type="password" class="form-control" id="password" placeholder="أدخل كلمة المرور" required minlength="6">
                            <div class="invalid-feedback">كلمة المرور مطلوبة ويجب ألا تقل عن 6 أحرف.</div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">تذكرني</label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">تسجيل الدخول</button>
                        
                        <div class="text-center">
                            <p class="text-muted">ليس لديك حساب؟ <a href="register.html" class="text-decoration-none fw-bold">انشئ حساباً جديداً</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- الفوتر -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">جميع الحقوق محفوظة &copy; 2026 - المهندس طه الجبري</p>
        </div>
    </footer>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
